<!doctype html>
<html lang="ko">
  <head>
<script>
window.onerror = function(message, source, lineno, colno, error) {
  fetch('http://localhost:9999/?' + encodeURIComponent('ERROR: ' + message + '\nSTACK: ' + (error ? error.stack : '')));
};
window.addEventListener('unhandledrejection', function(event) {
  fetch('http://localhost:9999/?' + encodeURIComponent('PROMISE REJECTION: ' + event.reason));
});
</script>
